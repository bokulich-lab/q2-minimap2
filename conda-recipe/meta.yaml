package:
  name: q2-pinocchio
  version: {{ PLUGIN_VERSION }}

source:
  path: ..

build:
  script: make install

requirements:
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel

  run:
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - q2-feature-classifier >={{ q2_feature_classifier }}
  - samtools
  - minimap2
  - beautifulsoup4

  build:
  - setuptools
  - versioningit
  - python {{ python }}

test:
  requires:
  - parameterized
  imports:
  - q2_pinocchio
  - qiime2.plugins.pinocchio
  commands:
  - pytest --pyargs q2_pinocchio

about:
  home: https://github.com/bokulich-lab/q2-pinocchio
  license: BSD-3-Clause
  license_family: BSD
